<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:url("123.png") no-repeat center center fixed;
    background-size:cover;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    width:90%;
    max-width:850px;
    padding:40px;
    border-radius:25px;
    background:rgba(20,20,20,.45);
    backdrop-filter:blur(12px);
    border:2px solid hotpink;
    box-shadow:0 0 35px rgba(255,20,147,.6);
}

h1{
    color:#ff69b4;
    font-size:60px;
    letter-spacing:5px;
    text-shadow:0 0 20px #ff1493;
    margin-bottom:20px;
}

p{
    color:white;
    font-size:20px;
    line-height:1.8;
    margin-bottom:40px;
}

.menu{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.menu a{
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#ff1493,#ff69b4,#000);
    padding:16px 40px;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    transition:.4s;
    box-shadow:0 0 20px rgba(255,20,147,.6);
}

.menu a:hover{
    transform:translateY(-6px) scale(1.08);
    box-shadow:0 0 30px hotpink;
    background:linear-gradient(45deg,#000,#ff1493,#ff69b4);
}
</style>

</head>

<body>
